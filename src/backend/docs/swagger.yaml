basePath: /api/v1
definitions:
  model.ApiError:
    properties:
      error:
        type: string
      message:
        type: string
      status:
        type: integer
    type: object
  model.ChapterCard:
    properties:
      chapter_idx:
        type: integer
      end_time:
        type: number
      id:
        type: string
      start_time:
        type: number
      summary:
        type: string
      title:
        type: string
    type: object
  model.ChaptersResponse:
    properties:
      chapters:
        items:
          $ref: '#/definitions/model.ChapterCard'
        type: array
      episode_id:
        type: string
    type: object
  model.ChatMessage:
    properties:
      content:
        type: string
      role:
        enum:
        - user
        - assistant
        type: string
    required:
    - content
    - role
    type: object
  model.ChatRequest:
    properties:
      history:
        items:
          $ref: '#/definitions/model.ChatMessage'
        type: array
      question:
        maxLength: 10000
        type: string
    required:
    - question
    type: object
  model.ChatResponse:
    properties:
      answer:
        type: string
    type: object
  model.EpisodeCard:
    properties:
      cover_url:
        type: string
      duration_seconds:
        type: integer
      id:
        type: string
      podcast_name:
        type: string
      processing_complete:
        type: boolean
      published_at:
        type: string
      summary:
        type: string
      title:
        type: string
    type: object
  model.EpisodeDetail:
    properties:
      audio_url:
        type: string
      cover_url:
        type: string
      duration_seconds:
        type: integer
      id:
        type: string
      podcast_name:
        type: string
      processing_complete:
        type: boolean
      published_at:
        type: string
      summary:
        type: string
      title:
        type: string
    type: object
  model.EpisodeDetailResponse:
    properties:
      episode:
        $ref: '#/definitions/model.EpisodeDetail'
    type: object
  model.EpisodeListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/model.EpisodeCard'
        type: array
      next_cursor:
        type: string
      total:
        type: integer
    type: object
  model.FactCheckClaim:
    properties:
      chapter_id:
        type: string
      claim:
        type: string
      claim_idx:
        type: integer
      explanation:
        type: string
      id:
        type: string
      sources:
        items:
          type: string
        type: array
      verdict:
        type: string
    type: object
  model.FactChecksResponse:
    properties:
      claims:
        items:
          $ref: '#/definitions/model.FactCheckClaim'
        type: array
      episode_id:
        type: string
    type: object
  model.HealthStatus:
    properties:
      database:
        type: string
      embedding:
        type: string
      minio:
        type: string
      status:
        type: string
    type: object
  model.SearchHighlight:
    properties:
      score:
        type: number
      start_time:
        type: number
      text:
        type: string
    type: object
  model.SearchResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/model.SearchResultItem'
        type: array
      query:
        type: string
      total:
        type: integer
    type: object
  model.SearchResultItem:
    properties:
      cover_url:
        type: string
      episode_id:
        type: string
      highlights:
        items:
          $ref: '#/definitions/model.SearchHighlight'
        type: array
      podcast_name:
        type: string
      score:
        type: number
      title:
        type: string
    type: object
  model.TranscriptLine:
    properties:
      chapter_id:
        type: string
      emotion:
        type: string
      emotion_score:
        type: number
      end_time:
        type: number
      has_fact_flag:
        type: boolean
      id:
        type: string
      start_time:
        type: number
      text:
        type: string
    type: object
  model.TranscriptResponse:
    properties:
      episode_id:
        type: string
      lines:
        items:
          $ref: '#/definitions/model.TranscriptLine'
        type: array
    type: object
host: localhost:8080
info:
  contact: {}
  description: Podcast analysis backend — episodes, chapters, transcripts, fact-checks,
    chat.
  title: Audiolens API
  version: "1.0"
paths:
  /episodes:
    get:
      description: Cursor-based paginated episode list with optional free-text search.
      parameters:
      - description: Free-text search on title and podcast name
        in: query
        name: q
        type: string
      - description: Cursor from previous response
        in: query
        name: cursor
        type: string
      - description: Page size (default 20, max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.EpisodeListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ApiError'
      summary: Episode-Liste
      tags:
      - episodes
  /episodes/{id}:
    get:
      description: Get episode detail for the header area above the tabs.
      parameters:
      - description: Episode ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.EpisodeDetailResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ApiError'
      summary: Episode-Detail
      tags:
      - episodes
  /episodes/{id}/audio:
    get:
      description: Proxy-Endpoint that streams the episode audio from object storage.
      parameters:
      - description: Episode ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Audio stream
        "206":
          description: Partial audio stream (range request)
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ApiError'
      summary: Audio-Datei streamen
      tags:
      - episodes
  /episodes/{id}/chapters:
    get:
      description: Get chapters for an episode. Returns 202 if segmentation is not
        ready yet.
      parameters:
      - description: Episode ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ChaptersResponse'
        "202":
          description: Segmentation not ready
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ApiError'
      summary: Kapitel eines Episodes
      tags:
      - chapters
  /episodes/{id}/chat:
    post:
      consumes:
      - application/json
      description: Ask a question about a podcast episode. The answer is generated
        based solely on the episode transcript.
      parameters:
      - description: Episode ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: User question
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.ChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ChatResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ApiError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ApiError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/model.ApiError'
      summary: Frage zum Podcast stellen
      tags:
      - chat
  /episodes/{id}/fact-checks:
    get:
      description: Get fact-check claims for an episode.
      parameters:
      - description: Episode ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.FactChecksResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ApiError'
      summary: Fact-Check-Flags für die Sidebar
      tags:
      - fact-checks
  /episodes/{id}/sync:
    get:
      description: Server-Sent Events stream for playback synchronization (stubbed).
      parameters:
      - description: Episode ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ApiError'
      summary: Playback-Position per SSE
      tags:
      - sync
  /episodes/{id}/transcript:
    get:
      description: Get transcript lines for an episode. Lines are annotated with has_fact_flag.
      parameters:
      - description: Episode ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.TranscriptResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ApiError'
      summary: Transkript-Zeilen
      tags:
      - transcript
  /health:
    get:
      description: Get the health status of the API, including database and MinIO
        connectivity.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.HealthStatus'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/model.HealthStatus'
      summary: Health check
      tags:
      - health
  /search:
    get:
      description: Search episodes and transcript chunks using natural-language queries
        via vector similarity.
      parameters:
      - description: Search query
        in: query
        name: q
        required: true
        type: string
      - default: 10
        description: Max episode results
        in: query
        name: limit
        type: integer
      - default: 3
        description: Max highlights per episode
        in: query
        name: highlights
        type: integer
      - default: 0.73
        description: Minimum similarity score
        in: query
        name: min_score
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.SearchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ApiError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/model.ApiError'
      summary: Semantic search
      tags:
      - search
swagger: "2.0"
